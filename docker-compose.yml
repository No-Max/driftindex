services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: driftindex
      POSTGRES_PASSWORD: driftindex
      POSTGRES_DB: driftindex
    volumes:
      - driftindex_pg:/var/lib/postgresql/data

volumes:
  driftindex_pg:
