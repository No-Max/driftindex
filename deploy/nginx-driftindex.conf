server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name driftindex.pro www.driftindex.pro;

    root /opt/driftindex/apps/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3221;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /opt/driftindex/storage/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Umami tracker (see also deploy/nginx-umami-tracker.conf for certbot HTTPS block)
    location = /stats/stats.js {
        proxy_pass http://127.0.0.1:3000/stats.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /stats/api/send {
        proxy_pass http://127.0.0.1:3000/api/send;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
