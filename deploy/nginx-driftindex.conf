# Main site — HTTP (also used behind TLS-terminating proxies on :80).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name driftindex.pro www.driftindex.pro;

    root /opt/driftindex/apps/web/dist;
    index index.html;

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3221/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3221;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /opt/driftindex/storage/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /stats/stats.js {
        proxy_pass http://127.0.0.1:3000/stats.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /stats/api/send {
        proxy_pass http://127.0.0.1:3000/api/send;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS for driftindex.pro (cert: certbot -d driftindex.pro -d www.driftindex.pro).
# Without this block, :443 falls through to the first SSL vhost (Umami analytics).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name driftindex.pro www.driftindex.pro;

    ssl_certificate /etc/letsencrypt/live/driftindex.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/driftindex.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/driftindex/apps/web/dist;
    index index.html;

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3221/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3221;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /opt/driftindex/storage/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /stats/stats.js {
        proxy_pass http://127.0.0.1:3000/stats.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /stats/api/send {
        proxy_pass http://127.0.0.1:3000/api/send;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
