# Umami dashboard — do not index (robots.txt + X-Robots-Tag).
# sudo certbot --nginx -d analytics.driftindex.pro

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name analytics.driftindex.pro;

    ssl_certificate /etc/letsencrypt/live/analytics.driftindex.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.driftindex.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name analytics.driftindex.pro;

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
