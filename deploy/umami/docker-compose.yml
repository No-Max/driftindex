# Umami analytics — separate from the app Postgres.
# On VPS: cd /opt/driftindex/deploy/umami && cp .env.example .env && edit secrets && docker compose up -d
#
# Dashboard: prefer https://analytics.driftindex.pro (DNS + certbot), or SSH tunnel:
#   ssh -L 3000:127.0.0.1:3000 driftindex  →  http://localhost:3000
# Tracker on the main site: https://driftindex.pro/stats/stats.js → /api/send

services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      # Less obvious name → fewer ad-blocker hits
      TRACKER_SCRIPT_NAME: stats.js
    depends_on:
      umami-db:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  umami_pg:
