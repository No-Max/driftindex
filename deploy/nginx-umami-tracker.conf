# Tracker endpoints on the main site (same-origin, no BASE_PATH needed).
# Script derives collect URL as <script-dir>/api/send → /stats/api/send.

location = /stats/stats.js {
    proxy_pass http://127.0.0.1:3000/stats.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /stats/api/send {
    proxy_pass http://127.0.0.1:3000/api/send;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
